name: Build Multi_Fuzzer .fap

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]

jobs:
  build_fap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Multi_Fuzzer
        uses: actions/checkout@v4
        with:
          path: multi_fuzzer

      - name: Checkout flipperzero-firmware (with submodules)
        uses: actions/checkout@v4
        with:
          repository: flipperdevices/flipperzero-firmware
          path: firmware
          submodules: recursive
          fetch-depth: 0

      - name: Ensure firmware submodules initialized
        working-directory: firmware
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          echo "Submodules status:"
          git submodule status --recursive || true

      - name: List firmware dir (debug)
        run: |
          echo "Contents of firmware/:"
          ls -la firmware || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build python3 python3-pip gcc-arm-none-eabi scons

      - name: Install firmware Python deps if present
        run: |
          if [ -f firmware/requirements.txt ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install --user -r firmware/requirements.txt
          else
            echo "No firmware/requirements.txt found, skipping pip install"
          fi
          export PATH="$HOME/.local/bin:$PATH"
          echo "PATH: $PATH"

      - name: Copy app into firmware applications_user
        run: |
          mkdir -p firmware/applications_user
          cp -r multi_fuzzer firmware/applications_user/Multi_Fuzzer
          echo "applications_user contents:"
          ls -la firmware/applications_user || true

      - name: Build .fap (build all user faps / debug)
        working-directory: firmware
        run: |
          echo "------ applications_user list ------"
          ls -la applications_user || true
          echo "------ Multi_Fuzzer dir list ------"
          ls -la applications_user/Multi_Fuzzer || true
          echo "------ application.fam content ------"
          cat applications_user/Multi_Fuzzer/application.fam || true

          chmod +x ./fbt || true
          echo "Running fbt faps_user (skip sync)"
          FBT_NO_SYNC=1 bash ./fbt faps_user || (
            echo "faps_user failed, trying per-app fap targets (fuzzer_ibtn / fuzzer_rfid)"
            FBT_NO_SYNC=1 bash ./fbt fap_fuzzer_ibtn fap_fuzzer_rfid
          ) || (echo "All fbt attempts failed" && exit 1)

          echo "Looking for built .fap files..."
          find dist -type f -name "*.fap" -print || true

      - name: Upload built .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi_fuzzer_fap
          path: |
            firmware/dist/**/*.fap
