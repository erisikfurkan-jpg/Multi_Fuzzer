name: Build Multi_Fuzzer .fap

on:
  workflow_dispatch:
  push:
    branches: [ "dev", "main" ]

jobs:
  build_fap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Multi_Fuzzer
        uses: actions/checkout@v4
        with:
          path: multi_fuzzer

      - name: Checkout flipperzero-firmware
        uses: actions/checkout@v4
        with:
          repository: flipperdevices/flipperzero-firmware
          path: firmware

      - name: List firmware dir (debug)
        run: |
          echo "Contents of firmware/:"
          ls -la firmware || true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build python3 python3-pip gcc-arm-none-eabi

      - name: Install firmware Python deps if present
        run: |
          if [ -f firmware/requirements.txt ]; then
            python3 -m pip install --upgrade pip
            python3 -m pip install --user -r firmware/requirements.txt
          else
            echo "No firmware/requirements.txt found, skipping pip install"
          fi
          echo "PATH before: $PATH"
          export PATH="$HOME/.local/bin:$PATH"
          echo "PATH after: $PATH"

      - name: Copy app into firmware applications_user
        run: |
          mkdir -p firmware/applications_user
          cp -r multi_fuzzer firmware/applications_user/Multi_Fuzzer
          echo "applications_user contents:"
          ls -la firmware/applications_user || true

      - name: Build .fap (run fbt via python3)
        working-directory: firmware
        run: |
          ls -la
          ls -la applications_user || true
          chmod +x ./fbt || true
          echo "Running fbt via python3"
          python3 ./fbt fap_Multi_Fuzzer || (echo "fbt failed, printing fbt contents" && head -n 200 ./fbt && exit 1)
          find dist -type f -name "*.fap" -print || true

      - name: Upload built .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi_fuzzer_fap
          path: |
            firmware/dist/**/*.fap
